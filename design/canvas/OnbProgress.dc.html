<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding progress</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="day" style="width:342px;height:44px;display:flex;align-items:center;gap:var(--s3);color:var(--ink);font-family:var(--sans)">
<a href="{{back}}" aria-label="Back" style="width:var(--tap);height:var(--tap);margin-left:-12px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
<div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="{{step}}" aria-label="{{label}}" style="flex-grow:1"><div class="progress-fill" style="width:{{pct}}"></div></div>
<span class="t-caption muted" style="min-width:32px;text-align:right">{{step}} of 4</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":1,"min":1,"max":4},"back":{"editor":"text","default":"Main.dc.html"},"$preview":{"width":342,"height":44}}'>
class Component extends DCLogic {
renderVals() {
const step = Math.min(4, Math.max(1, Number(this.props.step ?? 1)));
return {
step,
pct: (step * 25) + '%',
label: 'Step ' + step + ' of 4',
back: this.props.back ?? 'Main.dc.html'
};
}
}
</script>
</body>
</html>
