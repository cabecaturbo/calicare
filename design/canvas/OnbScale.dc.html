<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The one scale</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bar{transform-origin:bottom;animation:bar .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){.bar{animation:none}}
</style>
</helmet>
<div class="day" style="width:390px;height:844px;box-sizing:border-box;padding:52px var(--gutter) 40px;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column">
<dc-import name="OnbProgress" step="{{step}}" back="OnbName.dc.html" hint-size="342px,44px"></dc-import>
<div style="margin-top:var(--s6);display:flex;flex-direction:column;gap:var(--s2)">
<span class="t-caption muted">Once a day</span>
<h1 class="t-title" style="margin:0">How was Cal’s skin today?</h1>
</div>

<div style="position:relative;margin-top:var(--s6)" role="img" aria-label="Four answers from calm to very rough. Rougher is deeper and taller.">
<div style="height:190px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);align-items:end">
<span class="swatch sw-calm bar" style="height:48px;animation-delay:.3s"></span>
<span class="swatch sw-little-itchy bar" style="height:80px;animation-delay:.45s"></span>
<span class="swatch sw-flaring bar" style="height:132px;animation-delay:.6s"></span>
<span class="swatch sw-very-rough bar" style="height:172px;animation-delay:.75s"></span>
</div>
<div class="t-caption" style="margin-top:var(--s2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)"><span>Calm</span><span>A little itchy</span><span>Flaring</span><span>Very rough</span></div>
<svg width="342" height="44" viewBox="0 0 342 44" style="display:block;margin-top:var(--s1)" aria-hidden="true"><g class="loop">
<path class="ink draw" pathLength="1" style="animation-delay:1.1s" d="M4 4 C6 12 10 16 22 16 L150 17 C160 17 166 21 171 30 C176 21 182 17 192 17 L320 16 C332 16 336 12 338 4"/>
</g></svg>
<div class="t-caption rise" style="text-align:center;color:var(--accent);animation-delay:1.8s">One tap</div>
<svg width="110" height="70" viewBox="0 0 120 80" style="position:absolute;left:28px;top:24px" aria-hidden="true"><g class="loop">
<path class="ink draw" pathLength="1" style="animation-delay:1.5s" d="M64 8 C44 10 26 22 18 44"/>
<path class="ink draw" pathLength="1" style="animation-delay:2s" d="M12 34 L18 45 L28 38"/>
</g></svg>
<span class="t-caption rise" style="position:absolute;left:94px;top:16px;color:var(--accent);animation-delay:2s">Lighter is calmer</span>
</div>

<p class="t-body muted" style="margin:var(--s5) 0 0">Over weeks, this one answer is what shows you and your provider how things are going.</p>
<div style="flex-grow:1"></div>
<a href="OnbWidget.dc.html" class="btn-primary t-label">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { step: 2 }; }
}
</script>
</body>
</html>
