<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log from anywhere</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="day" style="width:390px;height:844px;box-sizing:border-box;padding:52px var(--gutter) 32px;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column">
<dc-import name="OnbProgress" step="{{step}}" back="OnbScale.dc.html" hint-size="342px,44px"></dc-import>

<div class="rise" style="margin:var(--s3) auto 0;width:209px;height:438px;overflow:hidden">
<div style="width:417px;height:876px;transform:scale(0.5);transform-origin:top left">
<dc-import name="Phone" surface="{{surface}}" mode="{{mode}}" loop="{{loop}}" tap="{{tap}}" hint-size="417px,876px"></dc-import>
</div>
</div>

<div role="radiogroup" aria-label="Where Itchy can live" style="margin-top:var(--s3);height:var(--tap);border-radius:var(--r-pill);background:var(--surface);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:2px;box-sizing:border-box">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button type="button" role="radio" aria-checked="true" class="t-caption" onClick="{{o.pick}}" style="border:0;border-radius:var(--r-pill);background:var(--bg);font-weight:600">{{o.label}}</button></sc-if>
<sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button type="button" role="radio" aria-checked="false" class="t-caption" onClick="{{o.pick}}" style="border:0;background:none">{{o.label}}</button></sc-if>
</sc-for>
</div>

<div style="margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)">
<h1 class="t-title" style="margin:0">Log at 2 AM without opening anything</h1>
<p class="t-body muted" style="margin:0">{{body}}</p>
</div>
<div style="flex-grow:1"></div>
<div style="display:flex;flex-direction:column;gap:var(--s1)">
<a href="{{guide}}" class="btn-primary t-label">Show me how</a>
<a href="OnbCheckin.dc.html" class="btn-text t-body">Skip for now</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"surface":{"editor":"enum","options":["home","lock","control"],"default":"home"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { surface: null }; }
renderVals() {
const surface = this.state.surface ?? this.props.surface ?? 'home';
const info = {
home: { label: 'Home Screen', mode: 'normal', loop: true, tap: '', guide: 'GuideHome1.dc.html', body: 'Put Itchy on your Home Screen. One tap logs it and the app never opens.' },
lock: { label: 'Lock Screen', mode: 'normal', loop: false, tap: '110,258', guide: 'GuideLock1.dc.html', body: 'Put Itchy on your Lock Screen. One tap logs it, even before you unlock.' },
control: { label: 'Control Center', mode: 'inUse', loop: false, tap: '75,154', guide: 'GuideControl1.dc.html', body: 'Put Log Itchy in Control Center, one swipe away from anywhere.' }
};
const cur = info[surface] || info.home;
return {
step: 3,
surface,
mode: cur.mode,
loop: cur.loop,
tap: cur.tap,
body: cur.body,
guide: cur.guide,
options: ['home', 'lock', 'control'].map(id => ({
label: info[id].label, on: id === surface, off: id !== surface,
pick: () => this.setState({ surface: id })
}))
};
}
}
</script>
</body>
</html>
