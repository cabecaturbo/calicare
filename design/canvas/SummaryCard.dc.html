<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Summary card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section class="{{themeClass}}" style="width:342px;height:128px;box-sizing:border-box;padding:var(--s4);background:var(--surface);border-radius:var(--r);display:flex;align-items:center;gap:var(--s3);color:var(--ink);font-family:var(--sans)">
<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1)">
<span class="t-caption muted">{{eyebrow}}</span>
<span class="t-title">{{heading}}</span>
<sc-if value="{{hasCaption}}" hint-placeholder-val="{{true}}">
<span class="t-caption muted">{{caption}}</span>
</sc-if>
<sc-if value="{{hasDots}}" hint-placeholder-val="{{false}}">
<span role="img" aria-label="{{dotsLabel}}" style="display:flex;gap:6px;margin-top:2px">
<sc-for list="{{dots}}" as="dot" hint-placeholder-count="3">
<sc-if value="{{dot.done}}" hint-placeholder-val="{{false}}"><span style="width:10px;height:10px;border-radius:var(--r-pill);background:var(--accent)"></span></sc-if>
<sc-if value="{{dot.todo}}" hint-placeholder-val="{{true}}"><span style="width:10px;height:10px;border-radius:var(--r-pill);border:1px solid var(--muted);box-sizing:border-box"></span></sc-if>
</sc-for>
</span>
</sc-if>
</div>
<sc-if value="{{isSun}}" hint-placeholder-val="{{false}}">
<svg width="{{artW}}" height="{{artH}}" viewBox="0 0 100 92" aria-hidden="true">
<path class="ink draw" pathLength="1" d="M50 30 C60 29 67 37 66 47 C65 56 57 62 48 61 C39 60 33 53 34 44 C35 36 41 31 50 30 Z"/>
<path class="ink draw" pathLength="1" style="animation-delay:.35s" d="M50 18 L50 10 M69 26 L75 20 M78 46 L86 45 M31 26 L25 21 M22 47 L14 46"/>
<path class="ink draw" pathLength="1" style="animation-delay:.15s" d="M6 76 C24 72 40 78 56 75 C70 72 84 77 96 74"/>
</svg>
</sc-if>
<sc-if value="{{isMoon}}" hint-placeholder-val="{{false}}">
<svg width="{{artW}}" height="{{artH}}" viewBox="0 0 96 88" aria-hidden="true">
<path class="ink draw" pathLength="1" d="M58 18 C44 20 36 32 38 46 C40 60 53 68 66 64 C56 62 48 54 47 42 C46 31 51 22 58 18 Z"/>
<path class="ink draw" pathLength="1" style="animation-delay:.4s" d="M20 22 L20 30 M16 26 L24 26 M80 40 L80 46 M77 43 L83 43 M26 62 L26 67 M23.5 64.5 L28.5 64.5"/>
</svg>
</sc-if>
<sc-if value="{{isFlower}}" hint-placeholder-val="{{false}}">
<svg width="{{artW}}" height="{{artH}}" viewBox="0 0 88 92" aria-hidden="true">
<path class="ink draw" pathLength="1" d="M44 84 C43 70 46 58 44 44"/>
<path class="ink draw" pathLength="1" style="animation-delay:.3s" d="M44 40 C38 30 38 22 44 20 C50 22 50 30 44 40 Z M44 40 C54 34 62 34 63 40 C61 46 53 46 44 40 Z M44 40 C50 50 49 58 43 59 C38 56 39 48 44 40 Z M44 40 C34 46 26 46 25 40 C27 34 35 34 44 40 Z"/>
<path class="ink draw" pathLength="1" style="animation-delay:.1s" d="M14 86 C30 83 52 88 76 84"/>
</svg>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"eyebrow":{"editor":"text","default":"Last night"},"heading":{"editor":"text","default":"A good night"},"caption":{"editor":"text","default":"One itchy wake-up, at 2:14 AM"},"art":{"editor":"enum","options":["sun","moon","flower","none"],"default":"sun"},"dotsTotal":{"editor":"int","default":0},"dotsDone":{"editor":"int","default":0},"compact":{"editor":"boolean","default":false},"theme":{"editor":"enum","options":["day","night"],"default":"day"},"$preview":{"width":342,"height":128}}'>
class Component extends DCLogic {
renderVals() {
const art = this.props.art ?? 'sun';
const caption = this.props.caption ?? '';
const total = Number(this.props.dotsTotal ?? 0);
const done = Number(this.props.dotsDone ?? 0);
const dots = Array.from({ length: total }, (_, i) => ({ done: i < done, todo: i >= done }));
const compact = this.props.compact === true || this.props.compact === 'true';
return {
artW: compact ? 60 : 84,
artH: compact ? 58 : 80,
eyebrow: this.props.eyebrow ?? 'Last night',
heading: this.props.heading ?? 'A good night',
caption,
hasCaption: caption.length > 0,
hasDots: total > 0,
dots,
dotsLabel: done + ' of ' + total + ' done',
isSun: art === 'sun',
isMoon: art === 'moon',
isFlower: art === 'flower',
themeClass: this.props.theme === 'night' ? 'night' : 'day'
};
}
}
</script>
</body>
</html>
