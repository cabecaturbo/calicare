<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Tabs" class="{{themeClass}}" style="width:{{width}};height:62px;box-sizing:border-box;padding:0 6px;border-radius:var(--r-pill);background:var(--bar-bg);border:var(--hairline) solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;color:var(--ink);font-family:var(--sans)">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
<sc-if value="{{tab.isActive}}" hint-placeholder-val="{{false}}">
<a href="{{tab.href}}" class="t-tab" aria-current="page" style="height:50px;border-radius:var(--r-pill);background:var(--surface);color:var(--accent);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"/></svg>{{tab.label}}</a>
</sc-if>
<sc-if value="{{tab.isOther}}" hint-placeholder-val="{{true}}">
<a href="{{tab.href}}" class="t-tab" style="height:50px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"/></svg>{{tab.label}}</a>
</sc-if>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","plan","progress"],"default":"today"},"theme":{"editor":"enum","options":["day","night"],"default":"day"},"width":{"editor":"int","default":230},"$preview":{"width":230,"height":62}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'today';
const night = this.props.theme === 'night';
const tabs = [
{ id: 'today', label: 'Today', href: night ? 'TodayNight.dc.html' : 'Today.dc.html', icon: 'M3 18h18M7 18a5 5 0 0 1 10 0M12 7v2M5.6 11.6l1.4 1.4M18.4 11.6 17 13' },
{ id: 'plan', label: 'Plan', href: night ? 'PlanNight.dc.html' : 'Plan.dc.html', icon: 'M8 4h8v3H8zM6 5.5H5v15h14v-15h-1M9 12h6M9 16h6' },
{ id: 'progress', label: 'Progress', href: night ? 'ProgressNight.dc.html' : 'Progress.dc.html', icon: 'M4 19h16M5 15l4-4 3 3 6-6' }
].map(t => ({ ...t, isActive: t.id === active, isOther: t.id !== active }));
return { tabs, themeClass: night ? 'night' : 'day', width: Number(this.props.width ?? 230) + 'px' };
}
}
</script>
</body>
</html>
