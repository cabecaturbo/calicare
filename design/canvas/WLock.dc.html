<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock Screen widgets and control</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="w-mono" style="width:{{w}};height:{{h}};color:var(--w-fg);font-family:var(--sans);display:flex;align-items:center;justify-content:center">
<sc-if value="{{isCircle}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="Log itching" style="width:72px;height:72px;border:0;border-radius:var(--r-pill);background:var(--w-bg);color:var(--w-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<span class="t-itchy-s">Itchy</span>
</button>
</sc-if>
<sc-if value="{{isRect}}" hint-placeholder-val="{{false}}">
<div style="width:160px;height:72px;box-sizing:border-box;padding:var(--s2) var(--s3);border-radius:var(--r);background:var(--w-bg);display:flex;flex-direction:column;justify-content:center;gap:2px">
<span class="t-label">Tonight: 2</span>
<span class="t-caption" style="color:var(--w-muted)">Last 1:52 AM</span>
</div>
</sc-if>
<sc-if value="{{isControl}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<button type="button" aria-label="Log Itchy" style="width:68px;height:68px;border:0;border-radius:var(--mock-r-control);background:var(--w-bg);color:var(--w-fg);display:flex;align-items:center;justify-content:center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-2a2 2 0 0 0-4 0"/></svg>
</button>
<span class="t-caption">Log Itchy</span>
</div>
</sc-if>
<sc-if value="{{isControlWide}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Log Itchy" style="width:148px;height:68px;border:0;border-radius:var(--mock-r-control);background:var(--w-bg);color:var(--w-fg);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);box-sizing:border-box">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-2a2 2 0 0 0-4 0"/></svg>
<span style="display:flex;flex-direction:column;align-items:flex-start"><span class="t-label">Log Itchy</span><span class="t-caption" style="color:var(--w-muted)">Cali Care</span></span>
</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["circle","rect","control","controlWide"],"default":"circle"},"$preview":{"width":72,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const kind = this.props.kind ?? 'circle';
const sizes = { circle: [72, 72], rect: [160, 72], control: [80, 96], controlWide: [148, 68] };
const s = sizes[kind] || sizes.circle;
return {
w: s[0] + 'px', h: s[1] + 'px',
isCircle: kind === 'circle', isRect: kind === 'rect',
isControl: kind === 'control', isControlWide: kind === 'controlWide'
};
}
}
</script>
</body>
</html>
