name: CaliCare

options:
  bundleIdPrefix: com.cursorkittens
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Approved exception to the no-packages rule (prompt 2.2). Nothing else.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F2J8ZU2NQJ
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  App:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - target: Core
      - target: WidgetsExtension
      - target: MessagesExtension
      - package: Supabase
        product: Supabase
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Cali Care
        CFBundleName: Cali Care
        # Tonight and the Phase 0 Lock Screen test.
        NSSupportsLiveActivities: true
        # calicare://note opens the note sheet (the medium widget's Note button).
        CFBundleURLTypes:
          - CFBundleURLName: com.cursorkittens.calicare
            CFBundleURLSchemes: [calicare]
        # Empty when Config/Supabase.local.xcconfig is missing; accounts are then hidden.
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        # Lets the app name the shared keychain group extensions will read.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only iPhone app; without this, device builds warn.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Scanning a care plan (Plan › Add your care plan) and progress photos (Progress › Photos).
        NSCameraUsageDescription: Scan your child’s care plan or take progress photos. The pictures stay on this phone.
        # Background sync (prompt 2.3).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.cursorkittens.calicare.sync
        # Lets Siri match "Cali Care" (two words) to the app name.
        INAlternativeAppNames:
          - INAlternativeAppName: Cali Care
            INAlternativeAppNamePronunciationHint: Cali Care
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cursorkittens.calicare
        com.apple.developer.applesignin:
          - Default
        # The Supabase session lives here so extensions can read it later.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cursorkittens.calicare.shared
    settings:
      base:
        PRODUCT_NAME: CaliCare
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetsExtension
    dependencies:
      - target: Core
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: WidgetsExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Cali Care Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetsExtension/WidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cursorkittens.calicare
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cursorkittens.calicare.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.widgets
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  MessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - MessagesExtension
    dependencies:
      - target: Core
        embed: false
      - sdk: Messages.framework
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Cali Care
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: MessagesExtension/MessagesExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cursorkittens.calicare
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cursorkittens.calicare.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  Core:
    type: framework
    platform: iOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_NAME: Core
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.core
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  CoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CoreTests
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.coretests
        GENERATE_INFOPLIST_FILE: YES

  DesignReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DesignReviewUITests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.designreview
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: App

schemes:
  # Screenshots for design review and the VisualSteps assets. Run on demand;
  # it drives the simulator's Home Screen and Lock Screen.
  DesignReview:
    build:
      targets:
        App: all
        DesignReviewUITests: [test]
    test:
      config: Debug
      targets:
        - DesignReviewUITests

  App:
    build:
      targets:
        App: all
        WidgetsExtension: all
        MessagesExtension: all
        Core: all
    test:
      config: Debug
      targets:
        - CoreTests
    run:
      config: Debug
    archive:
      config: Release
