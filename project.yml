name: CaliCare

options:
  bundleIdPrefix: com.cursorkittens
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # TODO: set to your 10-character Apple Developer Team ID (see CLAUDE.md).
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  App:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: Core
      - target: WidgetsExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CaliCare
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cursorkittens.calicare
    settings:
      base:
        PRODUCT_NAME: CaliCare
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No app icon yet; set to AppIcon once one is added.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  WidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetsExtension
    dependencies:
      - target: Core
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: WidgetsExtension/Info.plist
      properties:
        CFBundleDisplayName: CaliCare Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetsExtension/WidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cursorkittens.calicare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.widgets
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  Core:
    type: framework
    platform: iOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_NAME: Core
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.core
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  CoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CoreTests
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorkittens.calicare.coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  App:
    build:
      targets:
        App: all
        WidgetsExtension: all
        Core: all
    test:
      config: Debug
      targets:
        - CoreTests
    run:
      config: Debug
    archive:
      config: Release
